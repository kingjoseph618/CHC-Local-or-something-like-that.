x finds the signal. I give it form. Analysis without presentation remains trapped. Presentation without analysis becomes noise."],["03:30–04:00","ORBY HOLDS THE PIPELINE","Ingest, authenticate, preserve, plan, narrate, compose, assemble, render, validate, release. When a stage fails, name the failure."],["04:00–04:30","THE EVIDENCE DESK","A fact is not an allegation. A statement is not independent proof. An inference must identify its foundation. Clarity protects everyone."],["04:30–05:00","FAILURE SPEAKS","Failure is information. Record the time, input, expected result, actual result, and next safe test. Never perform confidence over an empty output."],["05:00–05:30","THE PUBLIC DOOR","Professional does not mean exclusive. Secure does not mean hostile. Advanced does not mean inaccessible. The public door stays open."],["05:30–06:00","GOVERNMENT-READY","Bring structure: scope, controls, outcomes, accessibility, records, responsible ownership, and a clear human review point."],["06:00–06:30","VETERAN DISCIPLINE","Mission, accountability, adaptation, and service beyond self belong in the help desk, classroom, media room, and technology operation."],["06:30–07:00","THE RETURN PATH","A person returning from hardship does not need another maze. Show the next step, explain the reason, and preserve their choices."],["07:00–07:30","CREATORS KEEP OWNERSHIP","Preserve the original file, voice, permissions, edit history, and final publishing authority. Assistance must never silently steal authorship."],["07:30–08:00","TRAIN THE OPERATOR","The strongest bot helps the operator see, organize, test, and decide. Human review is where responsibility lives."],["08:00–08:30","M.E.N.U.","Technical skill, creative ownership, ethical business, and elite presentation. Learn the machinery. Protect the people. Explain the limits."],["08:30–09:00","BUILD TOGETHER","Collaboration makes boundaries visible and workable. The goal is not dependence on a mysterious machine. The goal is shared capability."],["09:00–09:30","THE RELEASE GATE","Verify source, rights, labels, links, timing, accessibility, and publishing authority. Precision is part of respect."],["09:30–10:00","THE ARCHITECTURE OF SERVICE","Powerful enough for institutions, open enough for the public, honest enough to survive inspection, and human enough to deserve trust. No capes. Just capability."]];let running=false,voice=true,base=0,held=0,last=-1,timer;const $=x=>document.getElementById(x),fmt=x=>String(Math.floor(x/60)).padStart(2,"0")+":"+String(Math.floor(x%60)).padStart(2,"0");function show(i){let s=S[Math.min(i,19)];$("k").textContent="SCENE "+String(i+1).padStart(2,"0")+" // "+s[0];$("title").textContent=s[1];$("line").textContent="“"+s[2]+"”";speechSynthesis.cancel();if(voice){let u=new SpeechSynthesisUtterance(s[2]);u.rate=.88;u.pitch=.93;speechSynthesis.speak(u)}}function tick(){if(!running)return;let e=(performance.now()-base)/1000+held;if(e>=600){running=false;clearInterval(timer);$("clock").textContent="10:00 / 10:00";$("bar").style.width="100%";return}let i=Math.floor(e/30);if(i!==last){last=i;show(i)}$("clock").textContent=fmt(e)+" / 10:00";$("bar").style.width=(e/6)+"%"}function begin(){running=true;held=0;base=performance.now();last=-1;$("start").classList.add("hide");clearInterval(timer);timer=setInterval(tick,250);tick()}$("begin").onclick=begin;$("restart").onclick=begin;$("play").onclick=()=>{if(running){held+=(performance.now()-base)/1000;running=false;speechSynthesis.pause();$("play").textContent="PLAY"}else{running=true;base=performance.now();speechSynthesis.resume();$("play").textContent="PAUSE";tick()}};$("voice").onclick=()=>{voice=!voice;$("voice").textContent=voice?"VOICE ON":"VOICE OFF";if(!voice)speechSynthesis.cancel()};$("full").onclick=()=>document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();$("save").onclick=e=>{e.preventDefault();let b=new Blob(["<!doctype html>"+document.documentElement.outerHTML],{type:"text/html"}),a=d
